# Reuse shared DingTalk notification jobs.
include:
  - project: dept/platformgroup/ci-template-repo
    ref: main
    file: dingtalk.yml

default:
  tags:
    - cloud

variables:
  BUILD_BRANCH_NAME: "dev"
  PNPM_VERSION: "11.10.0"

cache:
  key: $CI_PROJECT_ID
  paths:
    - node_modules
    - .pnpm-store
    - dist

stages:
  - install
  - build
  - deploy
  - dingtalk

install:
  image: registry.cn-hangzhou.aliyuncs.com/rcmirrors/node:22
  stage: install
  before_script:
    - npm config set registry=https://$NPM_REGISTRY_URL/
    - echo "//$NPM_REGISTRY_URL/:_authToken=$NPM_REGISTRY_TOKEN" >> ~/.npmrc
    - corepack enable
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - pnpm config set registry=https://$NPM_REGISTRY_URL/
    - pnpm config set store-dir .pnpm-store
    - node -v
    - pnpm -v
  script:
    - pnpm install --frozen-lockfile
    - pnpm run build
  artifacts:
    paths:
      - dist
    expire_in: 1 day
  only:
    variables:
      - $CI_COMMIT_BRANCH == $BUILD_BRANCH_NAME

build:
  image: registry.cn-hangzhou.aliyuncs.com/rcmirrors/docker:28
  stage: build
  needs:
    - job: install
      artifacts: true
  cache:
    key: $CI_PROJECT_ID
    paths:
      - dist
    policy: pull
  before_script:
    - mkdir -p ~/.docker
    - cat $DOCKER_REGISTRY_LOGIN_CONFIG > ~/.docker/config.json
    - FORMAT_COMMIT_TIME=$(echo $CI_COMMIT_TIMESTAMP | sed 's/[:-]/-/g; s/+.*$//g')
  script:
    - echo "dist files" `ls dist/`
    - docker build -t $DOCKER_REGISTRY_URL/$CI_PROJECT_NAME:$FORMAT_COMMIT_TIME .
    - docker push $DOCKER_REGISTRY_URL/$CI_PROJECT_NAME:$FORMAT_COMMIT_TIME
    - rm -rf dist
  only:
    variables:
      - $CI_COMMIT_BRANCH == $BUILD_BRANCH_NAME

deploy:
  cache: {}
  image:
    name: registry.cn-hangzhou.aliyuncs.com/rcmirrors/kubectl:1.33
    entrypoint: [""]
  before_script:
    - mkdir -p ~/.kube
    - cat $K8S_KUBE_CONFIG > ~/.kube/config
    - FORMAT_COMMIT_TIME=$(echo $CI_COMMIT_TIMESTAMP | sed 's/[:-]/-/g; s/+.*$//g')
  stage: deploy
  script:
    - echo $CI_PROJECT_NAME
    - echo $DOCKER_REGISTRY_VPC_URL
    - kubectl set image -n=test-2021 deployment/$CI_PROJECT_NAME $CI_PROJECT_NAME=$DOCKER_REGISTRY_VPC_URL/$CI_PROJECT_NAME:$FORMAT_COMMIT_TIME
  only:
    variables:
      - $CI_COMMIT_BRANCH == $BUILD_BRANCH_NAME

dingtalk-success:
  cache: {}
  stage: dingtalk
  image: registry.cn-hangzhou.aliyuncs.com/rcmirrors/openjdk:8-jdk-slim
  extends: .dingtalk-success
  when: on_success
  only:
    variables:
      - $CI_COMMIT_BRANCH == $BUILD_BRANCH_NAME

dingtalk-failure:
  cache: {}
  stage: dingtalk
  image: registry.cn-hangzhou.aliyuncs.com/rcmirrors/openjdk:8-jdk-slim
  extends: .dingtalk-failure
  when: on_failure
  only:
    variables:
      - $CI_COMMIT_BRANCH == $BUILD_BRANCH_NAME
