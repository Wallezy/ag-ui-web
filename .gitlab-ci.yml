# Reuse shared DingTalk notification jobs.
include:
  - project: dept/platformgroup/ci-template-repo
    ref: main
    file: dingtalk.yml

default:
  tags:
    - cloud

variables:
  PNPM_VERSION: "11.10.0"

cache:
  key: $CI_PROJECT_ID
  paths:
    - node_modules
    - .pnpm-store
    - dist

stages:
  - install
  - build
  - deploy-ks
  - dingtalk

quality:
  image: registry.cn-hangzhou.aliyuncs.com/rcmirrors/node:22
  stage: install
  before_script:
    - corepack enable
    - corepack prepare pnpm@$PNPM_VERSION --activate
    - |
      if [ -n "$NPM_REGISTRY_URL" ]; then
        npm config set registry "https://$NPM_REGISTRY_URL/"
        pnpm config set registry "https://$NPM_REGISTRY_URL/"
        if [ -n "$NPM_REGISTRY_TOKEN" ]; then
          echo "//$NPM_REGISTRY_URL/:_authToken=$NPM_REGISTRY_TOKEN" >> ~/.npmrc
        fi
      fi
    - pnpm config set store-dir .pnpm-store
    - node -v
    - pnpm -v
  script:
    - pnpm install --frozen-lockfile
    - cd contracts && sha256sum -c SHA256SUMS && cd ..
    - pnpm run typecheck
    - pnpm run test
    - pnpm run lint
    - pnpm run format:check
    - pnpm run build
  artifacts:
    paths:
      - dist
    expire_in: 1 day
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "github-dev"'

build:
  image: registry.cn-hangzhou.aliyuncs.com/rcmirrors/docker:28
  stage: build
  needs:
    - job: quality
      artifacts: true
  cache:
    key: $CI_PROJECT_ID
    paths:
      - dist
    policy: pull
  before_script:
    - mkdir -p ~/.docker
    - cat $DOCKER_REGISTRY_LOGIN_CONFIG > ~/.docker/config.json
    - FORMAT_COMMIT_TIME=$(echo $CI_COMMIT_TIMESTAMP | sed 's/[:-]/-/g; s/+.*$//g')
    - IMAGE_TAG=$FORMAT_COMMIT_TIME${CI_COMMIT_TAG:+-$CI_COMMIT_TAG}
  script:
    - echo "dist files" `ls dist/`
    - docker build -t $DOCKER_REGISTRY_URL/$CI_PROJECT_NAME:$IMAGE_TAG .
    - docker push $DOCKER_REGISTRY_URL/$CI_PROJECT_NAME:$IMAGE_TAG
    - rm -rf dist
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

deploy-ks:
  cache: {}
  image:
    name: registry.cn-hangzhou.aliyuncs.com/rcmirrors/kubectl:1.33
    entrypoint: [""]
  before_script:
    - mkdir -p ~/.kube
    - cat $K8S_KUBE_CONFIG_DEV > ~/.kube/config
  stage: deploy-ks
  needs:
    - job: build
  script:
    - echo $CI_PROJECT_NAME
    - echo $DOCKER_REGISTRY_VPC_URL
    - FORMAT_COMMIT_TIME=$(echo $CI_COMMIT_TIMESTAMP | sed 's/[:-]/-/g; s/+.*$//g')
    - IMAGE_TAG=$FORMAT_COMMIT_TIME${CI_COMMIT_TAG:+-$CI_COMMIT_TAG}
    - kubectl set image -n=oa deployment/$CI_PROJECT_NAME $CI_PROJECT_NAME=$DOCKER_REGISTRY_URL/$CI_PROJECT_NAME:$IMAGE_TAG
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

dingtalk-success:
  cache: {}
  stage: dingtalk
  image: registry.cn-hangzhou.aliyuncs.com/rcmirrors/openjdk:8-jdk-slim
  extends: .dingtalk-success
  when: on_success
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

dingtalk-failure:
  cache: {}
  stage: dingtalk
  image: registry.cn-hangzhou.aliyuncs.com/rcmirrors/openjdk:8-jdk-slim
  extends: .dingtalk-failure
  when: on_failure
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
