server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = / {
    return 302 /app/agents/;
  }

  location = /app/agents {
    try_files /app/agents/index.html =404;
  }

  location ^~ /app/agents/ {
    try_files $uri $uri/ /app/agents/index.html;
  }
}
